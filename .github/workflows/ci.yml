name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - master
      - "codex/dp-runtime-stack-*"
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nuono_schema_migration_ci
          MYSQL_USER: migration_ci
          MYSQL_PASSWORD: migration_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System delivery contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_delivery_contract.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source-size policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SOURCE_SIZE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m unittest discover -s scripts/tests -p 'test_source_size_gate.py'
          python scripts/source_size_gate.py

      - name: Verify single-scheduler release cutover
        run: >-
          python -m unittest
          scripts/tests/test_release_cutover_maintenance.py
          scripts/tests/test_release_maintenance_probe.py
          scripts/tests/test_release_trap_safety.py
          scripts/tests/test_release_database_idle.py
          scripts/tests/test_release_schema_drain.py
          scripts/tests/test_release_schema_cutover.py
          scripts/tests/test_file_parse_retirement_cutover.py
          scripts/tests/test_release_dp_runtime_cutover.py

      - name: Verify competitor business-date correction contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m unittest discover
          -s scripts/tests
          -p 'test_competitor*.py'

      - name: Verify competitor correction against MySQL 8
        env:
          COMPETITOR_MYSQL_DEFAULTS_FILE: ${{ runner.temp }}/competitor-mysql.cnf
          COMPETITOR_MYSQL_SCHEMA: nuono_schema_migration_ci
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          command -v mysql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y mysql-client
          }
          umask 077
          printf '%s\n' \
            '[client]' \
            'host=127.0.0.1' \
            'port=3306' \
            'user=migration_ci' \
            'password=migration_ci' \
            > "$COMPETITOR_MYSQL_DEFAULTS_FILE"
          python3 -m unittest scripts/ci/test_competitor_business_date_mysql.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Release artifact contract tests
        run: >-
          python3 -m unittest
          scripts/ci/test_package_release_artifact.py
          scripts/ci/test_competitor_release_artifact.py
          scripts/ci/test_verify_dp_candidate_jar.py
          scripts/tests/test_pre_catalog_baseline_gate.py
          scripts/tests/test_official_warehouse_collation_migration_contract.py
          scripts/tests/test_repository_migration_catalog.py
          scripts/tests/test_migration_livechecks.py
          scripts/tests/test_dp_pull_runtime_migration_contract.py
          scripts/tests/test_dp_pull_deadline_ci_contract.py
          scripts/tests/test_release_schema_migrations.py
          scripts/tests/test_schema_migration_artifact.py
          scripts/tests/test_mysql_migration_client.py
          scripts/tests/test_mysql_migration_database.py
          scripts/tests/test_runtime_drain_migration.py
          scripts/tests/test_release_schema_jar_freeze.py
          scripts/tests/test_rds_migration_ci_contract.py
          scripts/tests/test_warehouse_shipping_plan_migration.py
          scripts/tests/test_warehouse_forwarder_migration.py

      - name: Verify release schema migrations against MySQL
        env:
          NUONO_MIGRATION_MYSQL_DEFAULTS_FILE: ${{ runner.temp }}/nuono-migration.cnf
          NUONO_MIGRATION_EXPECTED_SCHEMA: nuono_schema_migration_ci
        run: |
          command -v mysql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y mysql-client
          }
          MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
            --user=root \
            --execute="SET GLOBAL log_bin_trust_function_creators=ON;"
          trigger_trust="$(
            MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
              --user=root --batch --skip-column-names \
              --execute="SELECT @@GLOBAL.log_bin_trust_function_creators;"
          )"
          test "$trigger_trust" = "1"
          umask 077
          printf '%s\n' \
            '[client]' \
            'host=127.0.0.1' \
            'port=3306' \
            'user=migration_ci' \
            'password=migration_ci' \
            'database=nuono_schema_migration_ci' \
            > "$NUONO_MIGRATION_MYSQL_DEFAULTS_FILE"
          python3 -m unittest scripts/ci/test_release_schema_migrations_mysql.py \
            scripts/ci/test_file_parse_retirement_mysql.py \
            scripts/ci/test_dp_pull_runtime_schema_mysql.py \
            scripts/ci/test_dp_pull_runtime_migration_runner_mysql.py \
            scripts/ci/test_noon_auth_owner_scope_mysql.py \
            scripts/ci/test_noon_auth_owner_scope_takeover_mysql.py

      - name: Verify migrations and DP deadlines against RDS-compatible MySQL 8 policy
        env:
          NUONO_MIGRATION_MYSQL_DEFAULTS_FILE: ${{ runner.temp }}/nuono-rds-migration.cnf
          NUONO_MIGRATION_EXPECTED_SCHEMA: nuono_schema_migration_rds_ci
          NUONO_MIGRATION_EXPECTED_PORT: "3307"
          NUONO_DP_DEADLINE_MYSQL_URL: jdbc:mysql://127.0.0.1:3307/nuono_schema_migration_rds_ci?useSSL=false&allowPublicKeyRetrieval=true
          NUONO_DP_DEADLINE_MYSQL_USERNAME: migration_ci
          NUONO_DP_DEADLINE_MYSQL_PASSWORD: migration_ci
          NUONO_DP10_EXACT_MYSQL_DEFAULTS_FILE: ${{ runner.temp }}/nuono-rds-dp10-exact.cnf
          NUONO_DP10_EXACT_EXPECTED_SCHEMA: nuono_dp10_exact_rds_ci
          NUONO_DP10_EXACT_EXPECTED_PORT: "3307"
          NUONO_DP10_EXACT_MYSQL_URL: jdbc:mysql://127.0.0.1:3307/nuono_dp10_exact_rds_ci?useSSL=false&allowPublicKeyRetrieval=true
          NUONO_DP10_EXACT_MYSQL_USERNAME: migration_ci
          NUONO_DP10_EXACT_MYSQL_PASSWORD: migration_ci
        run: |
          container_name="nuono-mysql-rds-policy-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup_rds_mysql() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup_rds_mysql EXIT
          docker run --detach --rm --name "$container_name" \
            --env MYSQL_ROOT_PASSWORD=root \
            --env MYSQL_DATABASE=nuono_schema_migration_rds_ci \
            --env MYSQL_USER=migration_ci \
            --env MYSQL_PASSWORD=migration_ci \
            --publish 3307:3306 \
            mysql:8.0.36 \
            --disabled-storage-engines=MyISAM,MEMORY,ARCHIVE
          ready=0
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if docker exec "$container_name" \
              mysqladmin ping --host=127.0.0.1 --user=root --password=root \
              --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          test "$ready" = "1"
          MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3307 \
            --user=root \
            --execute="SET GLOBAL log_bin_trust_function_creators=ON; \
              CREATE DATABASE nuono_dp10_exact_rds_ci \
                CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; \
              GRANT ALL PRIVILEGES ON nuono_dp10_exact_rds_ci.* \
                TO 'migration_ci'@'%'; FLUSH PRIVILEGES;"
          disabled_engines="$(
            MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3307 \
              --user=root --batch --skip-column-names \
              --execute="SELECT LOWER(@@GLOBAL.disabled_storage_engines);"
          )"
          test "$disabled_engines" = "myisam,memory,archive"
          umask 077
          printf '%s\n' \
            '[client]' \
            'host=127.0.0.1' \
            'port=3307' \
            'user=migration_ci' \
            'password=migration_ci' \
            'database=nuono_schema_migration_rds_ci' \
            > "$NUONO_MIGRATION_MYSQL_DEFAULTS_FILE"
          printf '%s\n' \
            '[client]' \
            'host=127.0.0.1' \
            'port=3307' \
            'user=migration_ci' \
            'password=migration_ci' \
            'database=nuono_dp10_exact_rds_ci' \
            > "$NUONO_DP10_EXACT_MYSQL_DEFAULTS_FILE"
          python3 -m unittest scripts/ci/test_release_schema_migrations_mysql.py \
            scripts/ci/test_file_parse_retirement_mysql.py \
            scripts/ci/test_dp_pull_runtime_schema_mysql.py \
            scripts/ci/test_dp_pull_runtime_migration_runner_mysql.py \
            scripts/ci/test_noon_auth_owner_scope_mysql.py \
            scripts/ci/test_noon_auth_owner_scope_takeover_mysql.py
          python3 scripts/ci/prepare_dp10_exact_path_mysql.py
          dp_deadline_tests="DataPullDatabaseDeadlineMySqlTest,DataPullDatabaseDeadlineConcurrencyMySqlTest,DataPullConnectionHandshakeMySqlTest,DataPullTransactionBeginNetworkMySqlTest,DataPullRuntimeSchedulerPhaseMySqlTest,DataPullRuntimeIndependentPhaseBudgetTest,RuntimeExecutorDeadlineTest,DataPullRuntimeSchedulerTest,DataPullAdvanceDeadlineRaceTest,Ali1688Dp10ExactPathMySqlTest,Ali1688Dp10TombstoneMySqlTest"
          mvn -q -Dtest="$dp_deadline_tests" test

      - name: Test and package
        run: mvn -q package

      - name: Verify packaged DP candidate boundary
        run: >-
          python3 scripts/ci/verify_dp_candidate_jar.py
          --jar target/nuono-next-backend-0.0.1-SNAPSHOT.jar

      - name: Prepare master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RELEASE_ARTIFACT_NAME: nuono-next-backend-${{ github.sha }}
        run: >-
          python3 scripts/ci/package_release_artifact.py
          --output-dir "$RUNNER_TEMP/backend-release-artifact"

      - name: Upload master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: nuono-next-backend-${{ github.sha }}
          path: ${{ runner.temp }}/backend-release-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
