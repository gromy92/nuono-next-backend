name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nuono_schema_migration_ci
          MYSQL_USER: migration_ci
          MYSQL_PASSWORD: migration_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System delivery contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_delivery_contract.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source-size policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SOURCE_SIZE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m unittest discover -s scripts/tests -p 'test_source_size_gate.py'
          python scripts/source_size_gate.py

      - name: Verify single-scheduler release cutover
        run: >-
          python -m unittest
          scripts/tests/test_release_cutover_maintenance.py
          scripts/tests/test_release_database_idle.py
          scripts/tests/test_release_schema_drain.py
          scripts/tests/test_release_schema_cutover.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Release artifact contract tests
        run: >-
          python3 -m unittest
          scripts/ci/test_package_release_artifact.py
          scripts/tests/test_pre_catalog_baseline_gate.py
          scripts/tests/test_repository_migration_catalog.py
          scripts/tests/test_release_schema_migrations.py
          scripts/tests/test_schema_migration_artifact.py
          scripts/tests/test_mysql_migration_client.py
          scripts/tests/test_mysql_migration_database.py
          scripts/tests/test_release_schema_jar_freeze.py
          scripts/tests/test_warehouse_shipping_plan_migration.py
          scripts/tests/test_warehouse_forwarder_migration.py

      - name: Verify release schema migrations against MySQL
        env:
          NUONO_MIGRATION_MYSQL_DEFAULTS_FILE: ${{ runner.temp }}/nuono-migration.cnf
          NUONO_MIGRATION_EXPECTED_SCHEMA: nuono_schema_migration_ci
        run: |
          command -v mysql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y mysql-client
          }
          MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
            --user=root \
            --execute="SET GLOBAL log_bin_trust_function_creators=ON;"
          trigger_trust="$(
            MYSQL_PWD=root mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
              --user=root --batch --skip-column-names \
              --execute="SELECT @@GLOBAL.log_bin_trust_function_creators;"
          )"
          test "$trigger_trust" = "1"
          umask 077
          printf '%s\n' \
            '[client]' \
            'host=127.0.0.1' \
            'port=3306' \
            'user=migration_ci' \
            'password=migration_ci' \
            'database=nuono_schema_migration_ci' \
            > "$NUONO_MIGRATION_MYSQL_DEFAULTS_FILE"
          python3 -m unittest scripts/ci/test_release_schema_migrations_mysql.py

      - name: Test and package
        run: mvn -q package

      - name: Prepare master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RELEASE_ARTIFACT_NAME: nuono-next-backend-${{ github.sha }}
        run: >-
          python3 scripts/ci/package_release_artifact.py
          --output-dir "$RUNNER_TEMP/backend-release-artifact"

      - name: Upload master release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: nuono-next-backend-${{ github.sha }}
          path: ${{ runner.temp }}/backend-release-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
